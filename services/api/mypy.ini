[mypy]
python_version = 3.12
check_untyped_defs = True
ignore_missing_imports = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
exclude = ^evals/results/

# Existing role orchestration is covered by gate tests and is being migrated
# incrementally. New intake modules remain fully checked.
[mypy-app.agent.providers]
ignore_errors = True

[mypy-app.main]
ignore_errors = True

[mypy-app.services.agent_service]
ignore_errors = True

[mypy-app.services.auth]
ignore_errors = True

[mypy-app.services.procurement_lifecycle]
ignore_errors = True

[mypy-app.services.role_assistants]
ignore_errors = True

[mypy-app.services.seed]
ignore_errors = True
