services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DATABASE_URL: sqlite:////data/procura.db
      APP_ENV: ${APP_ENV:-development}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3001}
      POLICY_PATH: /knowledge/PROCUREMENT_POLICY.md
      LANGGRAPH_CHECKPOINT_PATH: /data/procura-graph.db
    ports: ["8000:8000"]
    volumes: ["procura_data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    ports: ["${WEB_PORT:-3001}:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  procura_data:
